---
- name: Configure nginx logs
  hosts: webservers
  become: yes

  tasks:
    - name: Install logrotate
      apt:
        name: logrotate
        state: present
        update_cache: yes

    - name: Ensure nginx log directory exists
      file:
        path: /var/log/nginx
        state: directory
        owner: root
        group: adm
        mode: '0755'

    - name: Configure nginx log rotation
      copy:
        dest: /etc/logrotate.d/nginx-diplom
        content: |
          /var/log/nginx/*.log {
              daily
              rotate 7
              compress
              missingok
              notifempty
              create 0640 www-data adm
          }

    - name: Show nginx logs
      command: ls -la /var/log/nginx/
      register: nginx_logs
      changed_when: false

    - name: Print nginx logs
      debug:
        var: nginx_logs.stdout_lines
